services:
  - type: web
    name: gradeai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GRADEAI_OPENAI_API_KEY
        sync: false
      - key: GRADEAI_DATABASE_URL
        value: sqlite:///./data.db
