# nginx site for blinkscore.in: serves the built frontend and proxies the API.
# Install: sudo cp deploy/nginx-blinkscore.conf /etc/nginx/sites-available/blinkscore
#          sudo ln -sf /etc/nginx/sites-available/blinkscore /etc/nginx/sites-enabled/blinkscore
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d blinkscore.in -d www.blinkscore.in   # adds the HTTPS server block
#
# Same origin for pages and API is required: the teacher session cookie is
# SameSite=Lax and the frontend calls relative /api URLs.

server {
    listen 80;
    listen [::]:80;
    server_name blinkscore.in www.blinkscore.in;

    root /srv/blinkscore/www;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (BlinkScore + pilot). Grading can run for minutes on a full paper.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: /, /p/CODE, /w/CODE, /t/..., /login, /demo, /demo/admin
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
